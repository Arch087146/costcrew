[package]
name = "costcrew"
version = "0.1.0"
edition = "2021"
description = "See what every AI coding agent actually costs you — tokens, dollars, per repo, per day."
license = "MIT"
repository = "https://github.com/Arch087146/costcrew"
readme = "README.md"
keywords = ["cli", "ai", "tokens", "cost", "llm"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
opt-level = 2
strip = true
lto = true
