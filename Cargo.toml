[package]
name = "costcrew"
version = "0.4.3"
edition = "2021"
description = "The AI coding price database + your spend — interactive terminal app."
license = "MIT"
repository = "https://github.com/Arch087146/costcrew"
readme = "README.md"
keywords = ["cli", "ai", "tokens", "cost", "llm"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
crossterm = "0.29"

[profile.release]
opt-level = 2
strip = true
lto = true
