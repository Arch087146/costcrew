ShortDescription: The AI coding price database, plus what you spend on it.
Description: |-
  One binary, two halves. First: a bundled database of what every AI model
  costs - every input/output/cache rate per 1M tokens, works offline, no API
  key, nothing to configure. Second: your own spend, recorded by you, totaled
  by month and service, plus provider-reported truth from your API keys.
  Type `costcrew` for the interactive app; flags like `costcrew prices claude`
  work for scripting.
